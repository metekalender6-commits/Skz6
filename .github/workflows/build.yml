name: Build SKZ Zone Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build
        run: |
          PROJ=$(find . -name "SkzZone.csproj" | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "SkzZone.csproj bulunamadı! Repo içinde dosya var mı kontrol et:"
            find . -maxdepth 3
            exit 1
          fi
          echo "Bulunan proje: $PROJ"
          dotnet build "$PROJ" -c Release

      - name: Upload built DLL
        uses: actions/upload-artifact@v4
        with:
          name: SkzZone-dll
          path: '**/bin/Release/net10.0/SkzZone.dll'
